@let online = online$ | async;
@let label = online ? 'online' : 'offline';

<app-tab-nav-bar [tabs]="tabs()" />
<button
	mat-icon-button
	[color]="'primary'"
	[aria-label]="label"
	[matTooltip]="label"
	matTooltipPosition="above"
	(click)="toggleDbConnection()">
	<mat-icon>
		{{ online ? 'cloud' : 'cloud_off' }}
	</mat-icon>
</button>

<router-outlet />
