@let isOnline = online();
@let label = isOnline ? 'online' : 'offline';

<app-tab-nav-bar [tabs]="tabs()" />
<button
	mat-icon-button
	[color]="'primary'"
	[aria-label]="label"
	[matTooltip]="label"
	matTooltipPosition="above"
	(click)="toggleDbConnection()">
	<mat-icon>
		{{ isOnline ? 'cloud' : 'cloud_off' }}
	</mat-icon>
</button>

<router-outlet />
