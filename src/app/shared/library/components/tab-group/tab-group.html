@for (tab of tabs(); track $index) { @if ('badge' in tab && tab.badge) {
<button
	matButton="elevated"
	matBadgePosition="before"
	[matBadge]="tab.badge"
	[value]="$index"
	(click)="tabClick.emit(tab.label)">
	{{ tab.label }}
</button>
} @else {
<button 
    matButton="elevated" 
	[value]="$index" 
	(click)="tabClick.emit(tab.label)">
	{{ tab.label }}
</button>
} }
